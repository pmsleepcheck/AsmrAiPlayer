plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// CI/本地都可能没有可用的 release keystore（fork 没配 secrets、新克隆没 key.properties）。
// 此时 release 构建回退 debug 签名，保证包能出；有 key.properties 且 storeFile 真实存在才用 release 签名。
def releaseKeystoreReady = keystoreProperties['storeFile'] != null
        && keystoreProperties['storePassword'] != null
        && file(keystoreProperties['storeFile']).exists()

android {
    namespace = "com.aaplay"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aaplay"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystoreReady ? signingConfigs.release : signingConfigs.debug
            // 如果还有问题，可以临时禁用混淆
            minifyEnabled true  // 改为 false 可以禁用混淆
            shrinkResources true  // 改为 false 可以禁用资源压缩
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
}
    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:-options'
    }
}

flutter {
    source = "../.."
}
