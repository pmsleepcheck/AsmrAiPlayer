name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的tag时触发，如 v1.0.0
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare signing (有 secrets 用 release 签名，否则回退 debug)
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "storePassword=$KEY_STORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "Signing with the release keystore from secrets."
          else
            echo "::notice title=Signing::No signing secrets configured - falling back to the debug signing config."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos/
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 app-release.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/app-release.ipa

  build-windows:
    # 别改回 windows-latest：2026-06 起它 = Windows Server 2025 + Visual Studio 2026 (18.x)，
    # 而 Flutter 3.27 的 visual_studio.dart 不认识 VS 2026 → CMake 生成器回落
    # "Visual Studio 16 2019" → "could not find any instance of Visual Studio"。
    # windows-2022 自带 Visual Studio 2022 (17.x) + C++ 工作负载，Flutter 能正确映射。
    # 等升到支持 VS 2026 的 Flutter 后再考虑换回新镜像（flutter/flutter#176399）。
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath app-release-windows-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app-release-windows-x64.zip

  upload:
    runs-on: ubuntu-latest
    needs: [ build-android, build-ios, build-windows ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true

      - name: List files
        run: tree dist

      - name: Prepare scripts
        run: chmod +x .github/scripts/process_commits.sh

      # 发版版本号：tag 触发用 tag 名；手动 dispatch 读 pubspec.yaml 的 version（→ v1.3.0）。
      # 也就是「想发新版 = 改 pubspec 的 version:」，不必再手动打 tag。
      - name: Resolve release tag
        id: releasetag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Get Previous tag
        id: previoustag
        run: |
          # 范围终点一律用当前提交 SHA：tag 名可能在 checkout 之后才由 Release API 创建
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "is_first=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
            echo "is_first=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate commit messages
        id: commits
        run: |
          PREV_TAG=${{ steps.previoustag.outputs.tag }}
          DELIMITER="$(openssl rand -hex 16)"
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log "${GITHUB_SHA}" --pretty=format:"%s%n%b" | .github/scripts/process_commits.sh)
          else
            COMMITS=$(git log "${PREV_TAG}..${GITHUB_SHA}" --pretty=format:"%s%n%b" | .github/scripts/process_commits.sh)
          fi
          echo "commits<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      # 任何一次成功的运行都发版（不再仅限 tag 触发）：tag 不存在时由 GitHub 在
      # target_commitish 上创建；同名 Release 会被更新、同名附件会被覆盖（overwrite_files）。
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releasetag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          # 正式发布。带 `-beta` / `-rc` 之类后缀的版本自动标记为预发布，
          # 因此发预览版只要把 pubspec 版本写成 `1.3.0-rc.1` 或打 `v1.3.0-rc.1`。
          prerelease: ${{ contains(steps.releasetag.outputs.tag, '-') }}
          draft: false
          name: ${{ steps.releasetag.outputs.tag }}
          body: |
            ### 📋 Release Information
            **Version:** ${{ steps.releasetag.outputs.tag }}
            **Previous Version:** ${{ steps.previoustag.outputs.tag }}
            **Build Environment:** Flutter ${{ env.FLUTTER_VERSION }}

            ### 📝 Changelog
            ${{ steps.commits.outputs.commits }}

            完整更新记录见 [CHANGELOG.md](https://github.com/pmsleepcheck/AsmrAiPlayer/blob/main/CHANGELOG.md)。

            ### 📦 Distribution
            | File | Description | Purpose |
            |------|-------------|----------|
            | `.apk` | Android Package | 直接安装 |
            | `.aab` | Android App Bundle | Google Play 上架 |
            | `.ipa` | iOS App Archive | iOS 设备安装 |
            | `.zip` | Windows x64 便携包 | 解压即用 |

            ### 📱 Compatibility
            - Minimum Android SDK: 21 (Android 5.0)
            - Target Android SDK: 33 (Android 13)

            > 问题反馈请走 GitHub Issues。
          files: |
            dist/flutter-apk/app-release.apk
            dist/bundle/release/app-release.aab
            dist/app-release.ipa
            dist/app-release-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
